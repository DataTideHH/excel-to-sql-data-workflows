name: python-quality

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regenerate data and workbook
        run: |
          python scripts/generate_sample_data.py
          python scripts/generate_expected_results.py
          python scripts/generate_excel_workbook.py

      - name: Run Ruff
        run: ruff check .

      - name: Run pytest
        run: pytest

      - name: Verify expected outputs are committed
        run: |
          git diff --exit-code data/raw data/expected excel/excel_sql_workflows.xlsx
