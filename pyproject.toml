[project]
name = "excel-to-sql-data-workflows"
version = "0.1.0"
description = "Reference project comparing analytical intent across Excel, SQL, Power Query, and DAX"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
